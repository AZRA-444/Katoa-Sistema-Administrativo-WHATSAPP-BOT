services:
  whatsapp-bot:
    build: .
    container_name: katoa-whatsapp-bot
    restart: unless-stopped          # se levanta solo tras un fallo o reinicio del servidor
    env_file: .env
    environment:
      AUTH_DIR: /data/session_auth
    volumes:
      - wa_data:/data                # la sesión de WhatsApp sobrevive a reinicios y actualizaciones
    ports:
      - "127.0.0.1:5000:5000"        # solo local: expón el bot con un proxy HTTPS (Caddy/Nginx), no directo
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  wa_data:
